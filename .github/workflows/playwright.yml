name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 20
    
    - name: Start Docker services
      run: docker-compose up -d postgres redis

    - name: Install dependencies
      run: |
        cd backend && npm install
        cd ../frontend && npm install
        cd ../e2e && npm install

    - name: Database Initialization
      run: |
        cd backend
        npx prisma generate
        npx prisma db push --accept-data-loss
        npx prisma db seed
      env:
        DATABASE_URL: "postgresql://aaniry:aaniry_dev_2026@localhost:5432/aaniry_vms?schema=public"

    - name: Start Backend
      run: |
        cd backend
        npm run start &
      env:
        DATABASE_URL: "postgresql://aaniry:aaniry_dev_2026@localhost:5432/aaniry_vms?schema=public"
        JWT_SECRET: "dev-secret-key-do-not-use-in-prod"
        NODE_ENV: "development"
        CORS_ORIGIN: "http://localhost:3000"

    - name: Wait for Backend
      run: npx wait-on http://localhost:3001/api -t 60000

    - name: Install Playwright Browsers
      run: cd e2e && npx playwright install --with-deps

    - name: Run Playwright tests
      run: cd e2e && npx playwright test
      env:
        NEXT_PUBLIC_API_URL: "http://localhost:3001"

    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        path: e2e/playwright-report/
        retention-days: 7
